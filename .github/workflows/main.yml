# https://medium.com/@yusufbiyik/useful-github-actions-discord-webhooks-6e356751d954

name: Discord Notification
# Make sure to change what triggers your action based on your needs
on: [milestone, create, delete, fork, issues, member, pull_request, pull_request_review, issue_comment, push]
jobs:
  # ID of our job
  webhook-request:
    # OS to run our job on
    runs-on: ubuntu-latest
    steps:
    - name: Send a request to webhook
      run: |
        RESPONSE=$(curl -H "Content-Type: application/json" -X POST -d '{
        "username": "HallowLogs",
        "content": "",
        "embeds": [
          {
            "title": "[${{ github.event.head_commit.id }}](https://github.com/${{ github.repository }}/commit/${{ github.event.head_commit.id }} \"${{ github.event.head_commit.id }}\") ${{ github.event.head_commit.message }}",
            "description": "[`${{ github.event.head_commit.id.substring(0, 7) }}`](https://github.com/${{ github.repository }}/commit/${{ github.event.head_commit.id }} \"${{ github.event.head_commit.id }}\") ${{ github.event.head_commit.message }} - ${{ github.actor }}",
            "color": 14818627,
            "author": {
              "url": "https://github.com/${{ github.actor }}",
              "icon_url": "https://avatars.githubusercontent.com/u/${{ github.actor_id }}?v=4",
              "name": "${{ github.actor }}"
            },
            "url": "https://github.com/${{ github.repository }}"
          }
        ]
        }' ${{ secrets.DISCORD_WEBHOOK_URL }})
        echo "Webhook server response: $RESPONSE"
